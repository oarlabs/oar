# =============================================================================
# THE KIT'S OWN CI — does this thing actually run on a host that is not the
# machine it was written on?
#
# This is NOT modules/07-ci/verify.yml.template. That file is the template you
# copy into YOUR project, and it pins and downloads a toolchain. This one is
# the kit proving a claim about itself, and the claim is narrow and testable:
#
#     every executable piece of this kit runs on Linux and on Windows,
#     on stock Python, with nothing downloaded.
#
# (That sentence used to carry a count. A hand-maintained count in prose goes
# stale every time a tool lands - this file's own recorded lesson, KI-2 - so
# the claim is now over the set rather than over a number. The steps below
# are the enumeration.)
#
# DEAD SIMPLE ON PURPOSE. No toolchain fetch, no checksum pin, no cache, no
# matrix of Python versions. Every one of those would be a way for this job to
# go red for a reason that has nothing to do with the question being asked, and
# a CI job that is red for irrelevant reasons is a CI job people stop reading.
#
# WHAT A GREEN TICK HERE MEANS: the core tools are host-agnostic.
# WHAT IT DOES NOT MEAN: that the templates are correct (they are documents),
# that module 07's workflow template works (it is unproven — see its README),
# or that the .ps1 status board runs anywhere but Windows (it does not; that is
# what tools/statusline.py is for).
# =============================================================================

name: kit-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tools on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false        # a Windows-only failure is the whole point
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python and git versions (for the log)
        run: |
          python --version
          git --version

      # -- 1. the de-identification scanner proves it can still FIRE --------
      - name: deident scanner selftest
        run: python tools/deident_scan.py --selftest

      # -- 2. the certification runner's own bench -------------------------
      - name: verify selftest (the judges, judged)
        run: python modules/03-verification/verify.py --selftest

      # -- 2a. the suite adapter. NOTHING IS INSTALLED FOR THIS STEP, and
      #        that is the point: without pytest here, the selftest replays
      #        the committed golden fixtures (real pytest output, captured on
      #        a developer host) against the pure layer and prints LIVE HALF
      #        NOT RUN with the reason. What this step proves on CI is that
      #        the shape contract, the collapse rule and the negative controls
      #        hold on both hosts; what it deliberately does not prove is that
      #        this runner's pytest still reports what the fixtures recorded.
      - name: gate-line selftest (golden fixtures + the collapse rule)
        run: python modules/03-verification/gate_line.py --selftest

      # -- 2b. the status board, all four banner states --------------------
      - name: statusline selftest
        run: python tools/statusline.py --selftest

      # -- 2b2. THE CLASS, AS A LINT. Eight defects across six adoption
      #         walks were one defect: a check whose expectation comes from
      #         the artifact it asserts about. This fails when that is true
      #         and unwaived, and its own selftest reconstructs two of the
      #         historical instances as negative controls.
      - name: expectation-source lint (and its negative controls)
        run: |
          python tools/expectation_lint.py --selftest
          python tools/expectation_lint.py

      # -- 2b3. the adoption doctor's own judging layer. Its negative
      #         controls reconstruct real defects (the Debian `python` shim,
      #         a shipped example value read as configured, a floor of 1) and
      #         run the REAL resolver, the REAL case probe and the REAL path
      #         comparator against this host - which is the half a Linux
      #         runner and a Windows runner answer differently.
      - name: kit-doctor selftest
        run: python tools/kit_doctor.py --selftest

      # -- 2b4. THE KIT'S OWN HEADLINE NUMBER. The kit claims the loop
      #         publishes its own escape rate; this is the step where that
      #         stops being a sentence. The selftest proves the judging layer
      #         including its forced-red controls (the escape:nc-* rows in
      #         checks-registry.json - counted there, not here, so this
      #         comment cannot drift the way its "twelve" once did), and the second
      #         command computes the number over KNOWN-ISSUES.md - the kit's
      #         own escape-rate table - on BOTH hosts, so a Windows-only or
      #         Linux-only reading defect is a red here rather than a wrong
      #         number in a published document.
      - name: escape-rate selftest (its negative controls, and the ceiling cross-check)
        run: python modules/04-ledgers/escape_rate.py --selftest

      # NO --ceiling HERE, ON PURPOSE. The ceiling had three operative
      # spellings - this one, the gate command in verify.py, and the tool's
      # own DEFAULT_CEILING - and nothing related any two of them, so drift
      # between them was silent in every direction. This step now takes
      # DEFAULT_CEILING, which the selftest above binds to the gate's literal:
      # two authorities instead of three, and the remaining two cannot drift
      # apart without going red.
      - name: the kit's own escape rate, computed not narrated
        run: python modules/04-ledgers/escape_rate.py --ledger KNOWN-ISSUES.md

      # -- 2b5. ...and the forced-red half, in the runner. A tool that has
      #         never refused is a tool nobody has tested. This step INVERTS
      #         the exit code: it passes only when a missing ledger ABORTS.
      - name: escape-rate ABORT case (must go RED on a missing ledger)
        shell: python
        run: |
          import subprocess, sys
          p = subprocess.run([sys.executable,
                              "modules/04-ledgers/escape_rate.py",
                              "--ledger", "no/such/ledger.md"],
                             capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode != 2:
              print("::error::a missing ledger did NOT abort (exit "
                    f"{p.returncode}). An uncomputed metric must never "
                    "report a number.")
              sys.exit(1)
          if "ESCAPE LEDGER ABORT" not in p.stdout:
              print("::error::it went red, but without the ABORT token the "
                    "verify gate vetoes on. Check what actually failed.")
              sys.exit(1)
          print(f"missing ledger aborted as required (exit {p.returncode})")

      # -- 2b6. THE ATTRIBUTION LINT. Two rounds shipped a quotation written
      #         from memory and attributed to a shipped document (round 19,
      #         recorded as an oracle candidate and not built; round 22, the
      #         same class again). This is that oracle, narrow: a quoted
      #         string attributed to a named kit document must be in that
      #         document. The selftest runs first because it carries the
      #         control that stops the tool MANUFACTURING findings - a
      #         quotation that wraps across a line must still be found, which
      #         is the exact error the round-22 review itself made.
      - name: citation lint (and its negative controls)
        run: |
          python tools/citation_lint.py --selftest
          python tools/citation_lint.py

      # -- 2b7. ...and its forced-red half. This step INVERTS the exit code:
      #         it passes only when a planted fabrication is CAUGHT. It runs
      #         on a copy in a temporary directory - the kit's own tree is
      #         never modified to test a check against it.
      - name: citation lint FABRICATION case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib, shutil
          d = pathlib.Path(tempfile.mkdtemp())
          shutil.copy("README.md", d / "README.md")
          (d / "PLANTED.md").write_text(
              "A page that cites a document.\n\n"
              "The kit's own `README.md`:14 calls it "
              '"a sentence that no README anywhere has ever contained".\n',
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/citation_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a planted fabrication did NOT go red (exit "
                    f"{p.returncode}). A citation check that cannot refuse "
                    "is a citation check nobody has tested.")
              sys.exit(1)
          if "NOT IN THE DOCUMENT IT NAMES" not in p.stdout:
              print("::error::it went red, but not with the finding token. "
                    "Check what actually failed.")
              sys.exit(1)
          print(f"planted fabrication caught as required (exit {p.returncode})")

      # -- 2b7a. THE ROUND-27 HALF: right words, WRONG LINES. The fabrication
      #          case above proves the tool refuses a quotation that is not in
      #          the document. It says nothing about a quotation that IS there
      #          under a stale locator, which was the actual round-22 defect
      #          and the class round 26 found six of. Same inverted exit code,
      #          same temporary directory, the kit's own tree never touched.
      #          The planted locator is ONE line past the quotation - the
      #          tightest of the six real defects, and the case any tolerance
      #          above zero would pass.
      - name: citation lint window - correct locator stays GREEN, stale locator must go RED
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "SOURCE.md").write_text(
              "line one\nline two\nline three\n"
              "the words that are really here and they\n"
              "wrap across this line as well\nline six\n", encoding="utf-8")
          quote = ("the words that are really here and they wrap across "
                   "this line as well")
          # First: the CORRECT locator must stay green. A window check that
          # reds on a right citation manufactures findings, which is worse
          # than missing them. Note the quotation WRAPS in the source and the
          # locator names both lines it occupies.
          (d / "CITER.md").write_text(
              f'# Citing page\n\nSome prose. `SOURCE.md`:4-5 says "{quote}".\n',
              encoding="utf-8")
          ok = subprocess.run([sys.executable, "tools/citation_lint.py",
                               "--root", str(d)], capture_output=True, text=True)
          if ok.returncode != 0:
              print(ok.stdout[-3000:])
              print("::error::a CORRECT line locator went red. The window "
                    "check is manufacturing findings.")
              sys.exit(1)
          # Then: one line past it must go red.
          (d / "CITER.md").write_text(
              f'# Citing page\n\nSome prose. `SOURCE.md`:6-7 says "{quote}".\n',
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/citation_lint.py",
                              "--root", str(d)], capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a stale line locator did NOT go red (exit "
                    f"{p.returncode}). The window check cannot refuse.")
              sys.exit(1)
          if "NOT AT THE LINES IT NAMES" not in p.stdout:
              print("::error::it went red, but not with the window finding "
                    "token. Check what actually failed.")
              sys.exit(1)
          print(f"stale locator caught as required (exit {p.returncode}), "
                "and the correct locator stayed green")

      # -- 2b8. THE COUNT LINT, the citation lint's sibling. Round 23
      #         corrected QUICKSTART Step 0 from nine lines to ten; ONBOARD
      #         still said nine, about that document's Step 0 by name, and the
      #         round-24 acceptance run found it. This is that oracle, narrow:
      #         a stated count whose target this tool can locate must match
      #         the target. The selftest runs first because it carries the
      #         controls that stop the tool MANUFACTURING findings - a wrapped
      #         command counts once, and a number inside a paragraph is not a
      #         count of the block below it.
      - name: count lint (and its negative controls)
        run: |
          python tools/count_lint.py --selftest
          python tools/count_lint.py

      # -- 2b8a. THE QUANTIFIER LAYER's forced-red half, added in round 30.
      #          Round 29's review found two MAJORs with one root cause: a
      #          universal quantifier asserted over a target the writer could
      #          have enumerated and did not, a class the program had paid for
      #          four times in four rounds. The planted page is round 29's F1
      #          sentence over the shape of the table it quantified: three
      #          rows carry no bracketed source. This step INVERTS the exit
      #          code - it passes only when the false universal is CAUGHT -
      #          and it runs on a page in a temporary directory, so the kit's
      #          own tree is never modified to test a check against it.
      - name: count lint FALSE-UNIVERSAL case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "PLANTED.md").write_text(
              "# A comparison page\n\n"
              "Every row names an artifact and carries a source in "
              "brackets:\n\n"
              "| Claim | Verdict | Source |\n|---|---|---|\n"
              "| C1 | REDUNDANT-BY | [FETCHED] |\n"
              "| C11 | NO-MATCH-FOUND | none |\n"
              "| C17 | NO-MATCH-FOUND | none |\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/count_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a planted false universal did NOT go red (exit "
                    f"{p.returncode}). A quantifier check that cannot refuse "
                    "is a quantifier check nobody has tested.")
              sys.exit(1)
          if "THE CLAIM IS NOT TRUE OF EVERY ELEMENT" not in p.stdout:
              print("::error::it went red, but not with the quantifier "
                    "finding token. Check what actually failed.")
              sys.exit(1)
          print(f"planted false universal caught as required (exit "
                f"{p.returncode})")

      # -- 2b8b. ...and the control that keeps it from manufacturing them.
      #          The SAME page with every row sourced must stay GREEN. A
      #          checker that has only ever been red over a false universal
      #          would turn every correct universal in the kit into a finding,
      #          and that direction fails silently - nobody notices a lint
      #          that is red for a good reason on the wrong line.
      - name: count lint TRUE-UNIVERSAL control (must stay GREEN)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "PLANTED.md").write_text(
              "# A comparison page\n\n"
              "Every row names an artifact and carries a source in "
              "brackets:\n\n"
              "| Claim | Verdict | Source |\n|---|---|---|\n"
              "| C1 | REDUNDANT-BY | [FETCHED] |\n"
              "| C11 | NO-MATCH-FOUND | [SEARCH-URL] |\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/count_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 0:
              print("::error::a TRUE universal went red (exit "
                    f"{p.returncode}). The quantifier layer is manufacturing "
                    "findings, which is worse than missing them.")
              sys.exit(1)
          print("the true universal stayed green as required")

      # -- 2b9. ...and its forced-red half. This step INVERTS the exit code:
      #         it passes only when a planted stale count is CAUGHT. It runs
      #         on a copy in a temporary directory - the kit's own tree is
      #         never modified to test a check against it.
      - name: count lint STALE-COUNT case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib, shutil
          d = pathlib.Path(tempfile.mkdtemp())
          shutil.copy("QUICKSTART.md", d / "QUICKSTART.md")
          (d / "PLANTED.md").write_text(
              "A page that counts another document's step.\n\n"
              "| P3 | tooling green | Run `QUICKSTART.md` **Step 0** in the "
              "kit clone: three lines, all exit 0 |\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/count_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a planted stale count did NOT go red (exit "
                    f"{p.returncode}). A count check that cannot refuse is a "
                    "count check nobody has tested.")
              sys.exit(1)
          if "THE NUMBER IS NOT THE NUMBER" not in p.stdout:
              print("::error::it went red, but not with the finding token. "
                    "Check what actually failed.")
              sys.exit(1)
          print(f"planted stale count caught as required (exit {p.returncode})")

      # -- 2c. the fixture harness's OWN pure layer. It shipped a
      #        ship-blocker (a substring test on a regex field) that reported
      #        maximal green over an unwired gate. A checker with no checker.
      - name: hook-fixture harness selftest
        run: python modules/02-enforcement/hook_fixtures.py --selftest

      # -- 3. the enforcement gate: armed, alive, correctly deciding -------
      - name: hook fixtures (strict, armed)
        run: python modules/02-enforcement/hook_fixtures.py --strict --armed .claude/settings.json

      # -- 3b. THE DEAD-MAN CASE. A gate that has never been seen red has
      #        not been shown to work, and that applies to the gate's own
      #        harness. This step INVERTS the expected exit code: it passes
      #        only when the corpse hook makes the fixtures go red.
      - name: dead-man case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = tempfile.mkdtemp()
          subprocess.run([sys.executable,
                          "modules/02-enforcement/hook_fixtures.py",
                          "--make-deadman", d], check=True)
          corpse = str(pathlib.Path(d) / "hook_model_gate.py")
          p = subprocess.run([sys.executable,
                              "modules/02-enforcement/hook_fixtures.py",
                              "--hook", corpse],
                             capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode == 0:
              print("::error::the dead-man clause did NOT fire - a corpse hook "
                    "produced a clean run. Silence from a corpse was read as "
                    "consent.")
              sys.exit(1)
          if "DEAD-MAN" not in p.stdout:
              print("::error::the run went red, but not for the dead-man "
                    "reason. Check what actually failed.")
              sys.exit(1)
          print("dead-man clause fired as required (exit "
                f"{p.returncode})")

      # -- 4. the adoption path, end to end, in a throwaway repo -----------
      - name: adoption smoke
        run: python tools/adoption_smoke.py

      # -- 4b. ...and its own negative control: with the original repo-root
      #        defect planted back, the smoke must report INSTRUMENTED and
      #        exit 2. Exit 0 here would mean the smoke has stopped detecting
      #        the defect it was written for.
      - name: adoption smoke negative control (must be INSTRUMENTED, exit 2)
        shell: python
        run: |
          import subprocess, sys
          p = subprocess.run([sys.executable, "tools/adoption_smoke.py",
                              "--plant-f1"], capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode != 2 or "INSTRUMENTED" not in p.stdout:
              print(f"::error::expected INSTRUMENTED + exit 2, got exit "
                    f"{p.returncode}. Either the control did not fire, or the "
                    f"verdict vocabulary changed.")
              sys.exit(1)
          print("negative control fired as required")

      # -- 5. the kit's own full certification -----------------------------
      #    Last, because it is the only step whose greenness depends on the
      #    checkout being clean, which is the one thing a hosted runner can
      #    plausibly get wrong (line endings). If this is the only red step on
      #    one OS, read the judges gate's file list before anything else.
      - name: the kit certifies itself
        run: python modules/03-verification/verify.py
