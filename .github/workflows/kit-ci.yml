# =============================================================================
# THE KIT'S OWN CI — does this thing actually run on a host that is not the
# machine it was written on?
#
# This is NOT modules/07-ci/verify.yml.template. That file is the template you
# copy into YOUR project, and it pins and downloads a toolchain. This one is
# the kit proving a claim about itself, and the claim is narrow and testable:
#
#     every executable piece of this kit runs on Linux and on Windows,
#     on stock Python, with nothing downloaded.
#
# (That sentence used to carry a count. A hand-maintained count in prose goes
# stale every time a tool lands - this file's own recorded lesson, KI-2 - so
# the claim is now over the set rather than over a number. The steps below
# are the enumeration.)
#
# DEAD SIMPLE ON PURPOSE. No toolchain fetch, no checksum pin, no cache, no
# matrix of Python versions. Every one of those would be a way for this job to
# go red for a reason that has nothing to do with the question being asked, and
# a CI job that is red for irrelevant reasons is a CI job people stop reading.
#
# WHAT A GREEN TICK HERE MEANS: the core tools are host-agnostic.
# WHAT IT DOES NOT MEAN: that the templates are correct (they are documents),
# that module 07's workflow template works (it is unproven — see its README),
# or that the .ps1 status board runs anywhere but Windows (it does not; that is
# what tools/statusline.py is for).
# =============================================================================

name: kit-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tools on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false        # a Windows-only failure is the whole point
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: python and git versions (for the log)
        run: |
          python --version
          git --version

      # -- 1. the de-identification scanner proves it can still FIRE --------
      - name: deident scanner selftest
        run: python tools/deident_scan.py --selftest

      # -- 2. the certification runner's own bench -------------------------
      - name: verify selftest (the judges, judged)
        run: python modules/03-verification/verify.py --selftest

      # -- 2a. the suite adapter. NOTHING IS INSTALLED FOR THIS STEP, and
      #        that is the point: without pytest here, the selftest replays
      #        the committed golden fixtures (real pytest output, captured on
      #        a developer host) against the pure layer and prints LIVE HALF
      #        NOT RUN with the reason. What this step proves on CI is that
      #        the shape contract, the collapse rule and the negative controls
      #        hold on both hosts; what it deliberately does not prove is that
      #        this runner's pytest still reports what the fixtures recorded.
      - name: gate-line selftest (golden fixtures + the collapse rule)
        run: python modules/03-verification/gate_line.py --selftest

      # -- 2b. the status board, all four banner states --------------------
      - name: statusline selftest
        run: python tools/statusline.py --selftest

      # -- 2b2. THE CLASS, AS A LINT. Eight defects across six adoption
      #         walks were one defect: a check whose expectation comes from
      #         the artifact it asserts about. This fails when that is true
      #         and unwaived, and its own selftest reconstructs two of the
      #         historical instances as negative controls.
      - name: expectation-source lint (and its negative controls)
        run: |
          python tools/expectation_lint.py --selftest
          python tools/expectation_lint.py

      # -- 2b3. the adoption doctor's own judging layer. Its negative
      #         controls reconstruct real defects (the Debian `python` shim,
      #         a shipped example value read as configured, a floor of 1) and
      #         run the REAL resolver, the REAL case probe and the REAL path
      #         comparator against this host - which is the half a Linux
      #         runner and a Windows runner answer differently.
      - name: kit-doctor selftest
        run: python tools/kit_doctor.py --selftest

      # -- 2b4. THE KIT'S OWN HEADLINE NUMBER. The kit claims the loop
      #         publishes its own escape rate; this is the step where that
      #         stops being a sentence. The selftest proves the judging layer
      #         including its forced-red controls (the escape:nc-* rows in
      #         checks-registry.json - counted there, not here, so this
      #         comment cannot drift the way its "twelve" once did), and the second
      #         command computes the number over KNOWN-ISSUES.md - the kit's
      #         own escape-rate table - on BOTH hosts, so a Windows-only or
      #         Linux-only reading defect is a red here rather than a wrong
      #         number in a published document.
      - name: escape-rate selftest (its negative controls, and the ceiling cross-check)
        run: python modules/04-ledgers/escape_rate.py --selftest

      # NO --ceiling HERE, ON PURPOSE. The ceiling had three operative
      # spellings - this one, the gate command in verify.py, and the tool's
      # own DEFAULT_CEILING - and nothing related any two of them, so drift
      # between them was silent in every direction. This step now takes
      # DEFAULT_CEILING, which the selftest above binds to the gate's literal:
      # two authorities instead of three, and the remaining two cannot drift
      # apart without going red.
      - name: the kit's own escape rate, computed not narrated
        run: python modules/04-ledgers/escape_rate.py --ledger KNOWN-ISSUES.md

      # -- 2b5. ...and the forced-red half, in the runner. A tool that has
      #         never refused is a tool nobody has tested. This step INVERTS
      #         the exit code: it passes only when a missing ledger ABORTS.
      - name: escape-rate ABORT case (must go RED on a missing ledger)
        shell: python
        run: |
          import subprocess, sys
          p = subprocess.run([sys.executable,
                              "modules/04-ledgers/escape_rate.py",
                              "--ledger", "no/such/ledger.md"],
                             capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode != 2:
              print("::error::a missing ledger did NOT abort (exit "
                    f"{p.returncode}). An uncomputed metric must never "
                    "report a number.")
              sys.exit(1)
          if "ESCAPE LEDGER ABORT" not in p.stdout:
              print("::error::it went red, but without the ABORT token the "
                    "verify gate vetoes on. Check what actually failed.")
              sys.exit(1)
          print(f"missing ledger aborted as required (exit {p.returncode})")

      # -- 2b6. THE ATTRIBUTION LINT. Two rounds shipped a quotation written
      #         from memory and attributed to a shipped document (round 19,
      #         recorded as an oracle candidate and not built; round 22, the
      #         same class again). This is that oracle, narrow: a quoted
      #         string attributed to a named kit document must be in that
      #         document. The selftest runs first because it carries the
      #         control that stops the tool MANUFACTURING findings - a
      #         quotation that wraps across a line must still be found, which
      #         is the exact error the round-22 review itself made.
      - name: citation lint (and its negative controls)
        run: |
          python tools/citation_lint.py --selftest
          python tools/citation_lint.py

      # -- 2b7. ...and its forced-red half. This step INVERTS the exit code:
      #         it passes only when a planted fabrication is CAUGHT. It runs
      #         on a copy in a temporary directory - the kit's own tree is
      #         never modified to test a check against it.
      - name: citation lint FABRICATION case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib, shutil
          d = pathlib.Path(tempfile.mkdtemp())
          shutil.copy("README.md", d / "README.md")
          (d / "PLANTED.md").write_text(
              "A page that cites a document.\n\n"
              "The kit's own `README.md`:14 calls it "
              '"a sentence that no README anywhere has ever contained".\n',
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/citation_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a planted fabrication did NOT go red (exit "
                    f"{p.returncode}). A citation check that cannot refuse "
                    "is a citation check nobody has tested.")
              sys.exit(1)
          if "NOT IN THE DOCUMENT IT NAMES" not in p.stdout:
              print("::error::it went red, but not with the finding token. "
                    "Check what actually failed.")
              sys.exit(1)
          print(f"planted fabrication caught as required (exit {p.returncode})")

      # -- 2b7a. THE ROUND-27 HALF: right words, WRONG LINES. The fabrication
      #          case above proves the tool refuses a quotation that is not in
      #          the document. It says nothing about a quotation that IS there
      #          under a stale locator, which was the actual round-22 defect
      #          and the class round 26 found six of. Same inverted exit code,
      #          same temporary directory, the kit's own tree never touched.
      #          The planted locator is ONE line past the quotation - the
      #          tightest of the six real defects, and the case any tolerance
      #          above zero would pass.
      - name: citation lint window - correct locator stays GREEN, stale locator must go RED
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "SOURCE.md").write_text(
              "line one\nline two\nline three\n"
              "the words that are really here and they\n"
              "wrap across this line as well\nline six\n", encoding="utf-8")
          quote = ("the words that are really here and they wrap across "
                   "this line as well")
          # First: the CORRECT locator must stay green. A window check that
          # reds on a right citation manufactures findings, which is worse
          # than missing them. Note the quotation WRAPS in the source and the
          # locator names both lines it occupies.
          (d / "CITER.md").write_text(
              f'# Citing page\n\nSome prose. `SOURCE.md`:4-5 says "{quote}".\n',
              encoding="utf-8")
          ok = subprocess.run([sys.executable, "tools/citation_lint.py",
                               "--root", str(d)], capture_output=True, text=True)
          if ok.returncode != 0:
              print(ok.stdout[-3000:])
              print("::error::a CORRECT line locator went red. The window "
                    "check is manufacturing findings.")
              sys.exit(1)
          # Then: one line past it must go red.
          (d / "CITER.md").write_text(
              f'# Citing page\n\nSome prose. `SOURCE.md`:6-7 says "{quote}".\n',
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/citation_lint.py",
                              "--root", str(d)], capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a stale line locator did NOT go red (exit "
                    f"{p.returncode}). The window check cannot refuse.")
              sys.exit(1)
          if "NOT AT THE LINES IT NAMES" not in p.stdout:
              print("::error::it went red, but not with the window finding "
                    "token. Check what actually failed.")
              sys.exit(1)
          print(f"stale locator caught as required (exit {p.returncode}), "
                "and the correct locator stayed green")

      # -- 2b7b. ROUND 34, THE REPAIR HALF. A stale locator whose quotation
      #          occurs exactly once elsewhere has one correct replacement, so
      #          the tool names it and --fix writes it. The registry rows
      #          citation:stale-relocatable and citation:stale-ambiguous claim
      #          a forced red on 2026-08-26; this step keeps that claim
      #          standing rather than anecdotal. It also asserts the half that
      #          matters more: --fix must NOT guess when there are two
      #          candidates, and must not touch quoted text when there is one.
      - name: citation lint relocation - repair the unambiguous, refuse the ambiguous
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          def lint(d, *extra):
              return subprocess.run(
                  [sys.executable, "tools/citation_lint.py", "--root", str(d),
                   *extra], capture_output=True, text=True)
          # ONE occurrence: relocatable.
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "SOURCE.md").write_text(
              "a new opening paragraph\nthat pushed everything down\nalpha\n"
              "the words that really are in this file\nomega\n",
              encoding="utf-8")
          cited = ('# Citing\n\nProse. `SOURCE.md`:2 says "the words that '
                   'really are in this file".\n')
          (d / "CITER.md").write_text(cited, encoding="utf-8")
          p = lint(d)
          if p.returncode != 1 or "RELOCATABLE" not in p.stdout:
              print(p.stdout[-3000:])
              print("::error::a relocatable stale locator did not go red with "
                    "the RELOCATABLE message.")
              sys.exit(1)
          f = lint(d, "--fix")
          got = (d / "CITER.md").read_text(encoding="utf-8")
          want = cited.replace("`SOURCE.md`:2", "`SOURCE.md`:4")
          if f.returncode != 0 or got != want:
              print(f.stdout[-3000:])
              print("::error::--fix did not repair the locator exactly. "
                    f"got {got!r}")
              sys.exit(1)
          # TWO occurrences: the tool must refuse. A wrong line number written
          # under a green is worse than a red.
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "SOURCE.md").write_text(
              "alpha\nthe repeated words that occur twice\nbeta\ngamma\n"
              "the repeated words that occur twice\ndelta\n", encoding="utf-8")
          body = ('# Citing\n\nProse. `SOURCE.md`:3 says "the repeated words '
                  'that occur twice".\n')
          (d / "CITER.md").write_text(body, encoding="utf-8")
          p = lint(d, "--fix")
          if p.returncode != 1 or "AMBIGUOUS" not in p.stdout:
              print(p.stdout[-3000:])
              print("::error::--fix did not refuse an ambiguous relocation.")
              sys.exit(1)
          if (d / "CITER.md").read_text(encoding="utf-8") != body:
              print("::error::--fix EDITED a document it could not decide. "
                    "That is the failure this step exists to catch.")
              sys.exit(1)
          # TWO CLAIMANTS ON ONE LOCATOR (the review's MAJOR-2). Shape A reads
          # the quotation before the reference, shape B the one after it, and
          # both land on the same `:18`. Before the fix this oscillated
          # :18 -> :5 -> :18 across five --fix runs, exit stuck at 1. The
          # locator must now be REFUSED and left byte-identical, and the loop
          # must be stable rather than merely slow.
          d = pathlib.Path(tempfile.mkdtemp())
          src = ["filler"] * 30
          src[4] = "quote one really lives on line five"
          src[17] = "quote two really lives on line eighteen"
          (d / "SOURCE.md").write_text("\n".join(src) + "\n", encoding="utf-8")
          body = ('# Citing\n\n"quote one really lives on line five" '
                  '(`SOURCE.md`:18) says "quote two really lives on line '
                  'eighteen".\n')
          (d / "CITER.md").write_text(body, encoding="utf-8")
          for i in range(5):
              r = lint(d, "--fix")
              now = (d / "CITER.md").read_text(encoding="utf-8")
              if now != body:
                  print(r.stdout[-3000:])
                  print(f"::error::--fix EDITED a contested locator on run "
                        f"{i + 1}. Two attributions share it and disagree, so "
                        "any rewrite breaks one of them.")
                  sys.exit(1)
          if "CONFLICT" not in r.stdout:
              print(r.stdout[-3000:])
              print("::error::a contested locator was refused without saying "
                    "why. The CONFLICT message is the actionable half.")
              sys.exit(1)
          print("relocation repaired where it was a fact, refused where it "
                "would have been a guess, and refused a contested locator "
                "stably across five runs")

      # -- 2b7c. ROUND 34, THE SECTION-ANCHOR FORM. `FILE.md` §N and
      #          `FILE.md`, "Heading text" are the citation forms that survive
      #          an edit above them, which is why the kit is migrating to them.
      #          A form nobody checks is a convention, not a rule. Both halves
      #          here: a section that is not there must go red, and one that IS
      #          there must stay green - the second matters because a new check
      #          that reds correct citations is worse than no check.
      - name: citation lint section anchors (must go RED on a section that is not there)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          def lint(d):
              return subprocess.run(
                  [sys.executable, "tools/citation_lint.py", "--root", str(d)],
                  capture_output=True, text=True)
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "SOURCE.md").write_text(
              "# Doc\n\n## 1. First\nprose\n## 4.7 Second\nprose\n"
              "## Also measured, at Level 1 (5 min)\n"
              "prose mentioning a phrase never used as a heading here\n",
              encoding="utf-8")
          for cite, why in (
                  ('Read `SOURCE.md` §9 first.',
                   "a section number the target does not carry"),
                  ('See `SOURCE.md`, "a phrase never used as a heading".',
                   "a quoted string that is prose, not a heading")):
              (d / "CITER.md").write_text(f"# Citing\n\n{cite}\n",
                                          encoding="utf-8")
              p = lint(d)
              if (p.returncode != 1
                      or "NAMES A SECTION THAT IS NOT THERE" not in p.stdout):
                  print(p.stdout[-3000:])
                  print(f"::error::{why} did NOT go red (exit "
                        f"{p.returncode}).")
                  sys.exit(1)
          # ...and the green half, both forms.
          for cite in ('Read `SOURCE.md` §4.7 first.',
                       'See `SOURCE.md`, "Also measured, at Level 1".'):
              (d / "CITER.md").write_text(f"# Citing\n\n{cite}\n",
                                          encoding="utf-8")
              g = lint(d)
              if g.returncode != 0:
                  print(g.stdout[-3000:])
                  print("::error::a CORRECT section anchor went red. The "
                        "anchor check is manufacturing findings.")
                  sys.exit(1)
          print("section anchors refuse what is not there and pass what is")

      # -- 2b7d. ROUND 34, THE BARE-LOCATOR DISCLOSURE (the review's MINOR-4).
      #          This one is not a gate and must never become one: a bare
      #          locator is a COVERAGE disclosure, so the exit code stays 0 and
      #          the visible effect is the state word and a summary segment.
      #          That is exactly why it needs a CI step - a number nothing
      #          asserts can be dropped in a tidy-up without any gate noticing,
      #          and the disclosure is the only reason the residual is
      #          countable. Also asserts the fence rule, since a locator inside
      #          a code block would otherwise inflate the count.
      - name: citation lint bare-locator disclosure (must stay exit 0 and stay VISIBLE)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          def lint(d):
              return subprocess.run(
                  [sys.executable, "tools/citation_lint.py", "--root", str(d)],
                  capture_output=True, text=True)
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "SOURCE.md").write_text(
              "line one\nline two\nalpha\nthe words that really are here\n",
              encoding="utf-8")
          (d / "CITER.md").write_text(
              "# Citing\n\nThe rule at `SOURCE.md`:320 stands unchanged.\n",
              encoding="utf-8")
          p = lint(d)
          if p.returncode != 0:
              print(p.stdout[-3000:])
              print("::error::a bare locator went RED. It is a coverage "
                    "disclosure, not a finding - see the module docstring.")
              sys.exit(1)
          for token, what in (
                  ("1 bare locator(s) unguarded", "the summary segment"),
                  ("CITATION LINT: PARTIAL", "the PARTIAL state word"),
                  ("CITER.md:3 -> SOURCE.md:320", "the location")):
              if token not in p.stdout:
                  print(p.stdout[-3000:])
                  print(f"::error::{what} is missing. A disclosure nobody "
                        "sees is not a disclosure.")
                  sys.exit(1)
          # A locator inside a FENCE is an example of the form, not a citation,
          # and counting it inflates the number that says how much migration is
          # left. With only the fenced one present the run must read CLEAN.
          (d / "CITER.md").write_text(
              "# Citing\n\nWrite it like this:\n\n```markdown\n"
              "The rule at `SOURCE.md`:320 stands unchanged.\n```\n",
              encoding="utf-8")
          g = lint(d)
          if g.returncode != 0 or "0 bare locator(s) unguarded" not in g.stdout:
              print(g.stdout[-3000:])
              print("::error::a FENCED bare locator was counted. That inflates "
                    "the disclosure with examples.")
              sys.exit(1)
          if "CITATION LINT: CLEAN" not in g.stdout:
              print(g.stdout[-3000:])
              print("::error::with nothing unguarded the state word should be "
                    "CLEAN.")
              sys.exit(1)
          print("bare-locator disclosure stays exit 0, stays visible, and "
                "does not count fenced examples")

      # -- 2b8. THE COUNT LINT, the citation lint's sibling. Round 23
      #         corrected QUICKSTART Step 0 from nine lines to ten; ONBOARD
      #         still said nine, about that document's Step 0 by name, and the
      #         round-24 acceptance run found it. This is that oracle, narrow:
      #         a stated count whose target this tool can locate must match
      #         the target. The selftest runs first because it carries the
      #         controls that stop the tool MANUFACTURING findings - a wrapped
      #         command counts once, and a number inside a paragraph is not a
      #         count of the block below it.
      - name: count lint (and its negative controls)
        run: |
          python tools/count_lint.py --selftest
          python tools/count_lint.py

      # -- 2b8a. THE QUANTIFIER LAYER's forced-red half, added in round 30.
      #          Round 29's review found two MAJORs with one root cause: a
      #          universal quantifier asserted over a target the writer could
      #          have enumerated and did not, a class the program had paid for
      #          four times in four rounds. The planted page is round 29's F1
      #          sentence over the shape of the table it quantified: three
      #          rows carry no bracketed source. This step INVERTS the exit
      #          code - it passes only when the false universal is CAUGHT -
      #          and it runs on a page in a temporary directory, so the kit's
      #          own tree is never modified to test a check against it.
      - name: count lint FALSE-UNIVERSAL case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "PLANTED.md").write_text(
              "# A comparison page\n\n"
              "Every row names an artifact and carries a source in "
              "brackets:\n\n"
              "| Claim | Verdict | Source |\n|---|---|---|\n"
              "| C1 | REDUNDANT-BY | [FETCHED] |\n"
              "| C11 | NO-MATCH-FOUND | none |\n"
              "| C17 | NO-MATCH-FOUND | none |\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/count_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a planted false universal did NOT go red (exit "
                    f"{p.returncode}). A quantifier check that cannot refuse "
                    "is a quantifier check nobody has tested.")
              sys.exit(1)
          if "THE CLAIM IS NOT TRUE OF EVERY ELEMENT" not in p.stdout:
              print("::error::it went red, but not with the quantifier "
                    "finding token. Check what actually failed.")
              sys.exit(1)
          print(f"planted false universal caught as required (exit "
                f"{p.returncode})")

      # -- 2b8b. ...and the control that keeps it from manufacturing them.
      #          The SAME page with every row sourced must stay GREEN. A
      #          checker that has only ever been red over a false universal
      #          would turn every correct universal in the kit into a finding,
      #          and that direction fails silently - nobody notices a lint
      #          that is red for a good reason on the wrong line.
      - name: count lint TRUE-UNIVERSAL control (must stay GREEN)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "PLANTED.md").write_text(
              "# A comparison page\n\n"
              "Every row names an artifact and carries a source in "
              "brackets:\n\n"
              "| Claim | Verdict | Source |\n|---|---|---|\n"
              "| C1 | REDUNDANT-BY | [FETCHED] |\n"
              "| C11 | NO-MATCH-FOUND | [SEARCH-URL] |\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/count_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 0:
              print("::error::a TRUE universal went red (exit "
                    f"{p.returncode}). The quantifier layer is manufacturing "
                    "findings, which is worse than missing them.")
              sys.exit(1)
          print("the true universal stayed green as required")

      # -- 2b9. ...and its forced-red half. This step INVERTS the exit code:
      #         it passes only when a planted stale count is CAUGHT. It runs
      #         on a copy in a temporary directory - the kit's own tree is
      #         never modified to test a check against it.
      - name: count lint STALE-COUNT case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib, shutil
          d = pathlib.Path(tempfile.mkdtemp())
          shutil.copy("QUICKSTART.md", d / "QUICKSTART.md")
          (d / "PLANTED.md").write_text(
              "A page that counts another document's step.\n\n"
              "| P3 | tooling green | Run `QUICKSTART.md` **Step 0** in the "
              "kit clone: three lines, all exit 0 |\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/count_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a planted stale count did NOT go red (exit "
                    f"{p.returncode}). A count check that cannot refuse is a "
                    "count check nobody has tested.")
              sys.exit(1)
          if "THE NUMBER IS NOT THE NUMBER" not in p.stdout:
              print("::error::it went red, but not with the finding token. "
                    "Check what actually failed.")
              sys.exit(1)
          print(f"planted stale count caught as required (exit {p.returncode})")

      # -- 2b10. THE SKIM LINT, added in round 31 to resolve a bet round 29
      #          declined and round 30 fired on both triggers. The first
      #          reader outside this program skimmed the front door, stopped,
      #          and never reached the escape table; three cold reads then
      #          reported the same routing failure, and the front door was
      #          restructured - the point at which a placement regression
      #          becomes cheap to introduce and expensive to notice. This is
      #          the mechanisable half and only that half: within the first N
      #          lines of README.md, is each of the three named practitioner
      #          artifacts reachable? The selftest runs first because it
      #          carries the controls that stop the tool MANUFACTURING
      #          findings - the window's edge, asserted on both sides, and a
      #          door that routes correctly staying green.
      - name: skim lint (and its negative controls)
        run: |
          python tools/skim_lint.py --selftest
          python tools/skim_lint.py

      # -- 2b10a. ...and its forced-red half, in the runner. This step INVERTS
      #           the exit code: it passes only when a front door that names an
      #           artifact too late is CAUGHT. The planted door is R29-3's own
      #           shape - the escape table reachable only from prose sixty
      #           lines down - and it runs in a temporary directory, so the
      #           kit's own tree is never modified to test a check against it.
      - name: skim lint LATE-ROUTING case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "README.md").write_text(
              "# A front door\n\n"
              "- **[`COMPARISON.md`](COMPARISON.md)** - the claims audit\n"
              + "\nprose that the reader does not finish\n" * 60
              + "- **`KNOWN-ISSUES.md`** - the escape table\n"
                "- **`docs/walks/`** - the prompts\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/skim_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a front door that routes to two of its three "
                    f"artifacts only past line 100 did NOT go red (exit "
                    f"{p.returncode}). A placement check that cannot refuse "
                    "is a placement check nobody has tested.")
              sys.exit(1)
          if "NOT REACHABLE FROM THE FIRST SCREEN" not in p.stdout:
              print("::error::it went red, but not with the finding token. "
                    "Check what actually failed.")
              sys.exit(1)
          print(f"late routing caught as required (exit {p.returncode})")

      # -- 2b10b. ...and the control that keeps it from manufacturing them.
      #           The SAME door with the three links in the door list must stay
      #           GREEN. A checker that has only ever been red over a badly
      #           routed front door would turn every correct one into a
      #           finding, and that direction fails silently.
      - name: skim lint CORRECT-ROUTING control (must stay GREEN)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          # QUICKSTART.md joined REQUIRED at the prose-floor review (the
          # adoption-door row); the planted good door routes all FOUR.
          (d / "README.md").write_text(
              "# A front door\n\n"
              "- **[`COMPARISON.md`](COMPARISON.md)** - the claims audit\n"
              "- **[`KNOWN-ISSUES.md`](KNOWN-ISSUES.md)** - the escape table\n"
              "- **[`QUICKSTART.md`](QUICKSTART.md)** - the full adoption\n"
              "- **[`docs/walks/`](docs/walks/)** - the prompts\n"
              + "\nprose that the reader does not finish\n" * 60,
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/skim_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 0:
              print(f"::error::a correctly routed front door went red (exit "
                    f"{p.returncode}). The skim lint is manufacturing "
                    "findings, which is worse than missing them.")
              sys.exit(1)
          if "SKIM LINT: CLEAN" not in p.stdout:
              print("::error::it stayed green, but without the CLEAN state "
                    "word - a door whose artifacts are all linked must not "
                    "read PARTIAL.")
              sys.exit(1)
          print("the correctly routed door stayed green as required")

      # -- 2b10c. ...and the ABORT case. "The check did not run" and "the
      #           check found nothing" must never share an exit code, which is
      #           this kit's own state-word doctrine applied to an exit
      #           contract. A missing front door is exit 2, not exit 0.
      - name: skim lint ABORT case (a missing front door must be exit 2)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "NOT-A-DOOR.md").write_text("# nothing here\n", encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/skim_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode != 2:
              print("::error::a tree with no front door did NOT abort (exit "
                    f"{p.returncode}). A run that read nothing must never "
                    "report what a clean run reports.")
              sys.exit(1)
          if "SKIM LINT: ABORT" not in p.stdout:
              print("::error::it went red, but without the ABORT token. Check "
                    "what actually failed.")
              sys.exit(1)
          print(f"missing front door aborted as required (exit {p.returncode})")

      # -- 2b10. THE REPEAT LINT, round 32. Round 30 relocated long-form text
      #          out of README.md into docs/START-HERE.md, corrected two false
      #          universals in the copy that STAYED, and moved the copy that
      #          WENT unchanged. A fresh-eyes read found three uncorrected
      #          instances from a cold start. This is that oracle: a universal
      #          claim written into two documents, where correcting one copy
      #          does not reach the other. The selftest runs first because it
      #          carries the eight controls that stop the tool going red on
      #          ordinary prose two documents in a 63-document tree share.
      - name: repeat lint (and its negative controls)
        run: |
          python tools/repeat_lint.py --selftest
          python tools/repeat_lint.py

      # -- 2b10b. The prose floor: reader-facing docs stay inside their word
      #           budgets, sentences stay short, jargon links the glossary,
      #           stock phrases are banned, and a new doc must declare its
      #           budget or exemption in prose-budgets.json. The selftest
      #           carries the forced-red controls.
      - name: prose floor (and its forced-red controls)
        run: |
          python tools/prose_floor.py --selftest
          python tools/prose_floor.py

      # -- 2b11. ...and its forced-red half. This step INVERTS the exit code:
      #          it passes only when a planted restatement is CAUGHT. The
      #          planted pair is R32-1's own shape - the sentence that rode the
      #          round-30 relocation - and it runs in a temporary directory, so
      #          the kit's own tree is never modified to test a check against
      #          it.
      - name: repeat lint RELOCATION case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          claim = ("every one of them was run by an LLM persona rather than "
                   "by a person")
          (d / "README.md").write_text(
              "# Front door\n\nThe evidence base is seven adoption walks, and "
              f"{claim}.\n", encoding="utf-8")
          docs = d / "docs"
          docs.mkdir()
          (docs / "START-HERE.md").write_text(
              "# Start here\n\nRelocated from `README.md`, intact.\n\n"
              f"The register says what the tests found — and {claim}.\n",
              encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/repeat_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-3000:])
          if p.returncode != 1:
              print("::error::a universal claim written into two documents did "
                    f"NOT go red (exit {p.returncode}). A check that cannot "
                    "refuse is a check nobody has tested.")
              sys.exit(1)
          if "THE SAME UNIVERSAL CLAIM IS STATED IN TWO DOCUMENTS" not in p.stdout:
              print("::error::it went red, but not with the finding token. "
                    "Check what actually failed.")
              sys.exit(1)
          print(f"planted restatement caught as required (exit {p.returncode})")

      # -- 2b12. ...and the control that keeps it from manufacturing findings.
      #          Two universals about DIFFERENT things must stay green, however
      #          alike their vocabulary. A repeat lint that reds on ordinary
      #          prose would make every shared sentence in this kit a finding,
      #          which is worse than no check at all.
      - name: repeat lint DIFFERENT-CLAIMS control (must stay GREEN)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          (d / "README.md").write_text(
              "# A\n\nEvery row of the sources table carries a bracketed tag "
              "naming where it came from.\n", encoding="utf-8")
          (d / "OTHER.md").write_text(
              "# B\n\nEvery check in this kit declares the artifact its "
              "expectation is read from.\n", encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/repeat_lint.py",
                              "--root", str(d)],
                             capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode != 0:
              print("::error::two DIFFERENT universal claims went red. The "
                    "repeat lint is manufacturing findings, which is worse "
                    "than missing them.")
              sys.exit(1)
          print("different claims stayed green as required")

      # -- 2b13. the seen-red field's forced red, in the runner. The registry
      #          gained a per-check seen_red field in round 32 because three
      #          consecutive adversarial reads convicted the sentence "every
      #          check has been seen to fail on purpose" and no instrument in
      #          the kit could answer it for any single check. An ABSENT field
      #          must be a failure; the value NEVER must not be. This step
      #          proves the first half by inverting the exit code.
      - name: expectation lint SEEN-RED case (a row with no seen_red must go RED)
        shell: python
        run: |
          import json, subprocess, sys, tempfile, pathlib
          d = pathlib.Path(tempfile.mkdtemp())
          reg = d / "reg.json"
          reg.write_text(json.dumps({"checks": [
              {"id": "x:has-it", "subject": "a.py:rule",
               "expectation_from": "inline", "seen_red": "NEVER"},
              {"id": "x:missing", "subject": "b.py:rule",
               "expectation_from": "inline"}]}), encoding="utf-8")
          p = subprocess.run([sys.executable, "tools/expectation_lint.py",
                              "--registry", str(reg)],
                             capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode != 1:
              print("::error::a registry row with no seen_red field did NOT go "
                    f"red (exit {p.returncode}). An absent field renders like "
                    "a recorded red, which is the defect this field answers.")
              sys.exit(1)
          if "carries no seen_red field" not in p.stdout:
              print("::error::it went red, but not with the seen-red finding. "
                    "Check what actually failed.")
              sys.exit(1)
          print(f"absent seen_red caught as required (exit {p.returncode})")

      # -- 2c. the fixture harness's OWN pure layer. It shipped a
      #        ship-blocker (a substring test on a regex field) that reported
      #        maximal green over an unwired gate. A checker with no checker.
      - name: hook-fixture harness selftest
        run: python modules/02-enforcement/hook_fixtures.py --selftest

      # -- 3. the enforcement gate: armed, alive, correctly deciding -------
      - name: hook fixtures (strict, armed)
        run: python modules/02-enforcement/hook_fixtures.py --strict --armed .claude/settings.json

      # -- 3b. THE DEAD-MAN CASE. A gate that has never been seen red has
      #        not been shown to work, and that applies to the gate's own
      #        harness. This step INVERTS the expected exit code: it passes
      #        only when the corpse hook makes the fixtures go red.
      - name: dead-man case (must go RED)
        shell: python
        run: |
          import subprocess, sys, tempfile, pathlib
          d = tempfile.mkdtemp()
          subprocess.run([sys.executable,
                          "modules/02-enforcement/hook_fixtures.py",
                          "--make-deadman", d], check=True)
          corpse = str(pathlib.Path(d) / "hook_model_gate.py")
          p = subprocess.run([sys.executable,
                              "modules/02-enforcement/hook_fixtures.py",
                              "--hook", corpse],
                             capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode == 0:
              print("::error::the dead-man clause did NOT fire - a corpse hook "
                    "produced a clean run. Silence from a corpse was read as "
                    "consent.")
              sys.exit(1)
          if "DEAD-MAN" not in p.stdout:
              print("::error::the run went red, but not for the dead-man "
                    "reason. Check what actually failed.")
              sys.exit(1)
          print("dead-man clause fired as required (exit "
                f"{p.returncode})")

      # -- 4. the adoption path, end to end, in a throwaway repo -----------
      - name: adoption smoke
        run: python tools/adoption_smoke.py

      # -- 4b. ...and its own negative control: with the original repo-root
      #        defect planted back, the smoke must report INSTRUMENTED and
      #        exit 2. Exit 0 here would mean the smoke has stopped detecting
      #        the defect it was written for.
      - name: adoption smoke negative control (must be INSTRUMENTED, exit 2)
        shell: python
        run: |
          import subprocess, sys
          p = subprocess.run([sys.executable, "tools/adoption_smoke.py",
                              "--plant-f1"], capture_output=True, text=True)
          print(p.stdout[-2000:])
          if p.returncode != 2 or "INSTRUMENTED" not in p.stdout:
              print(f"::error::expected INSTRUMENTED + exit 2, got exit "
                    f"{p.returncode}. Either the control did not fire, or the "
                    f"verdict vocabulary changed.")
              sys.exit(1)
          print("negative control fired as required")

      # -- 5. the kit's own full certification -----------------------------
      #    Last, because it is the only step whose greenness depends on the
      #    checkout being clean, which is the one thing a hosted runner can
      #    plausibly get wrong (line endings). If this is the only red step on
      #    one OS, read the judges gate's file list before anything else.
      - name: the kit certifies itself
        run: python modules/03-verification/verify.py
